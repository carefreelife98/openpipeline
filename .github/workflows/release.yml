name: Release

# Trusted Publishing (OIDC) release pipeline.
#
# Trigger: pushing a tag matching v* (e.g. v0.2.1) after the 9
# @openpipeline/* packages have already been bumped to that version in
# lockstep and the bump commit has been merged to main. See RELEASING.md.
#
# No npm tokens/secrets are used or required here -- that is the entire
# point of trusted publishing. Authentication is a short-lived OIDC token
# minted by GitHub Actions and exchanged for a publish grant by the npm CLI,
# scoped to exactly this repo + workflow file. See:
# https://docs.npmjs.com/trusted-publishers
# and docs/trusted-publishing-setup.md for the one-time npm-side setup.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required so GitHub Actions can mint the OIDC token npm exchanges for a publish grant
  contents: read

jobs:
  # (a) Full quality gate, run against the exact commit the tag points at,
  # plus a hard assertion that every package version matches the tag.
  # Nothing here is allowed to be skipped or soft-failed before publish.
  verify-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run tests with coverage gate
        run: pnpm test:ci

      - name: Assert lockstep versions match the pushed tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: tag '$TAG' is not a valid vX.Y.Z (or vX.Y.Z-prerelease) semver tag" >&2
            exit 1
          fi

          expected="${TAG#v}"
          echo "Expected lockstep version (from tag $TAG): $expected"

          mismatch=0
          for pkg in packages/*/package.json; do
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if [[ "$version" != "$expected" ]]; then
              echo "ERROR: $name is at $version, expected $expected (tag $TAG)" >&2
              mismatch=1
            else
              echo "OK: $name@$version"
            fi
          done

          if [[ "$mismatch" == "1" ]]; then
            echo "Version mismatch detected -- aborting release. Bump packages/*/package.json in lockstep, commit, and re-tag before pushing again." >&2
            exit 1
          fi

          echo "All packages match tag $TAG"

  # (b) Pack every workspace package with pnpm (so workspace:* is rewritten
  # to concrete versions -- npm pack/publish alone does NOT do this
  # rewrite), then publish each resulting tarball with the npm CLI in
  # leaf-first dependency order via trusted publishing.
  publish:
    needs: verify-gate
    runs-on: ubuntu-latest
    # No `environment:` key here by default -- the npm Trusted Publisher
    # config for all 9 packages is set up with a blank environment (see
    # docs/trusted-publishing-setup.md). If a maintainer later scopes
    # publishing to a GitHub Environment (e.g. for required reviewers),
    # add `environment: <name>` here AND update every package's Trusted
    # Publisher entry on npmjs.com to the same environment name -- the two
    # must match exactly or the OIDC exchange is rejected.
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Deliberately NOT setting `registry-url` here, even though npm's
          # own trusted-publishing example workflow includes it. Setting it
          # makes actions/setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the
          # runner .npmrc *unconditionally* -- including when NODE_AUTH_TOKEN
          # is unset/empty, which is exactly our case (no npm token exists in
          # this workflow by design). npm then sees auth as "already
          # configured" from that empty-token line, never starts the OIDC
          # trusted-publisher exchange, and `npm publish` fails with
          # ENEEDAUTH/404 instead of publishing.
          # Reproduced against npm 11.5.1 and 11.14.1, closed as a
          # setup-node duplicate with no fix shipped in setup-node or npm:
          # https://github.com/actions/setup-node/issues/1551
          # Corroborated: https://github.com/orgs/community/discussions/176761
          # `registry-url` buys this workflow nothing anyway -- we publish to
          # the default public registry and install no private dependencies
          # -- so we omit the input rather than work around the .npmrc line
          # it writes. If a future maintainer adds `registry-url` back for
          # some other reason, they must also clear `NODE_AUTH_TOKEN: ''` (or
          # strip the `_authToken` line) in the publish step below, or this
          # exact failure mode returns.
          #
          # Deliberately no `cache:` either. npm's own trusted-publishing
          # workflow example sets `package-manager-cache: false` and notes
          # "never use caching in release builds" -- keep the publish job's
          # toolchain state minimal and reproducible per tag.
          # https://docs.npmjs.com/trusted-publishers

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upgrade npm CLI for OIDC trusted publishing
        # Trusted publishing requires npm CLI >=11.5.1 and Node >=22.14.0.
        # Node 22's bundled npm is 10.x, which cannot perform the OIDC
        # token exchange -- it silently falls back to requiring a classic
        # auth token instead, so this upgrade is mandatory, not optional.
        # Source (accessed 2026-07-27), https://docs.npmjs.com/trusted-publishers:
        #   "Trusted publishing requires npm CLI version 11.5.1 or later
        #   and Node version 22.14.0 or higher."
        # Provenance attestations are generated automatically by trusted
        # publishing -- no `--provenance` flag is needed (same doc):
        #   "If you use trusted publishing, provenance attestations are
        #   automatically generated for your packages without requiring
        #   the --provenance flag."
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Pack all workspace packages (pnpm rewrites workspace:* to concrete versions)
        run: |
          set -euo pipefail
          mkdir -p .release-tarballs
          pnpm -r --filter "./packages/*" pack --pack-destination .release-tarballs
          ls -la .release-tarballs

      - name: Publish tarballs to npm, leaf-first, via trusted publishing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Leaf-first order: every package is published only after all of
          # its @openpipeline/* internal deps are already on the registry.
          #   nodes, mcp, store-memory, store-prisma, react -> depend on core
          #   planner                                        -> depends on core, nodes
          #   runtime                                        -> depends on core, nodes
          #   server                                          -> depends on core, runtime
          ORDER=(core nodes planner mcp store-memory store-prisma react runtime server)

          # Guard against ORDER silently drifting out of sync with what was
          # actually packed (e.g. a new packages/<name> added without
          # updating this list). Without this check, the loop below only
          # verifies each *listed* tarball exists (the `[ ! -f "$tarball" ]`
          # guard) -- it never notices *extra* tarballs that ORDER doesn't
          # mention. That means the job would go green while silently
          # shipping a release missing that package, with no signal
          # anywhere that anything was skipped.
          packed_count=$(find .release-tarballs -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')
          if [ "$packed_count" -ne "${#ORDER[@]}" ]; then
            echo "ERROR: .release-tarballs contains $packed_count tarball(s) but ORDER lists ${#ORDER[@]} package(s) (${ORDER[*]})." >&2
            echo "A package was likely added to or removed from packages/* without updating the leaf-first ORDER above. Update ORDER (respecting the @openpipeline/* dependency graph) before publishing -- do not proceed with a mismatched count." >&2
            ls -la .release-tarballs >&2
            exit 1
          fi

          for pkg in "${ORDER[@]}"; do
            tarball=".release-tarballs/openpipeline-${pkg}-${VERSION}.tgz"
            if [ ! -f "$tarball" ]; then
              echo "ERROR: expected tarball not found: $tarball" >&2
              exit 1
            fi
            # Idempotent re-run: a previous (partially failed) run of this
            # job, or a deliberate manual first-publish of a brand-new
            # package (see RELEASING.md fallback), may have already put this
            # exact version on the registry. npm publish would then fail the
            # whole loop with EPUBLISHCONFLICT mid-sequence, stranding every
            # later package in ORDER. Registry state at this exact version is
            # the release's single source of truth, so skip loudly and move
            # on. `npm view` exits non-zero for a missing version, which is
            # the "not published yet" branch.
            if npm view "@openpipeline/${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "SKIP @openpipeline/${pkg}@${VERSION} -- already on the registry (idempotent re-run)."
              continue
            fi
            echo "Publishing $tarball ..."
            # No --access flag: every packages/*/package.json already sets
            # "publishConfig": { "access": "public" }, which npm reads from
            # the packed tarball. npm CLI performs the OIDC trusted-publisher
            # exchange for this command automatically -- no token/secret is
            # read or required.
            npm publish "$tarball"
          done
